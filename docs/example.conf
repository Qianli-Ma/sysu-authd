enabled=1
interface=wan
device=wan
username=example
password_file=/tmp/sysu-authd-password
profile=sysu_ruijie
auth_backend=ruijie_compat
identity_format=%u
eapol_version=1
dhcp_after_success=1
healthcheck_enable=1
logoff_on_stop=1
reauth_enable=1
retry_policy=initial:3,max:300,forever:1
log_level=info
auth_timeout_sec=30
dhcp_timeout_sec=30
online_check_interval_sec=10
tick_interval_msec=250
